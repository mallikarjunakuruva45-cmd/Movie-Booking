
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;

            padding: 30px;
            border-radius: 10px;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;

            margin-top: 15px;

            border: none;
            border-radius: 5px;

            background: #007bff;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>


<body>

<div class="login-box">

    <h2>Login with Mobile</h2>

    <input
        type="text"
        id="mobile"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
    >

    <button id="sendOtpBtn">
        Send OTP
    </button>

    <div id="message"></div>

</div>

<!-- ========================================= -->
<!-- MSG91 SCRIPT -->
<!-- ========================================= -->

<script
    type="text/javascript"
    src="https://verify.msg91.com/otp-provider.js"
    onload="initSendOTP(configuration)">

<!-- ========================================= -->
<!-- LOGIN JAVASCRIPT -->
<!-- ========================================= -->

<script>

const mobileInput = document.getElementById("mobile");
const sendOtpBtn = document.getElementById("sendOtpBtn");
const message = document.getElementById("message");


function showMessage(text) {

    message.innerText = text;

}


/* =========================================
   SEND OTP
   ========================================= */

sendOtpBtn.addEventListener("click", function () {

    const mobile = mobileInput.value.trim();


    /* CHECK MOBILE NUMBER */

    if (!/^[0-9]{10}$/.test(mobile)) {

        showMessage(
            "Please enter a valid 10-digit mobile number."
        );

        return;
    }


    /* INDIA COUNTRY CODE */

    const msg91Mobile = "91" + mobile;


    sendOtpBtn.disabled = true;

    showMessage("Sending OTP...");


    console.log(
        "Sending OTP to:",
        msg91Mobile
    );


    /* =========================================
       MSG91 SEND OTP
       ========================================= */

    window.sendOtp(

        msg91Mobile,


        /* =====================================
           SUCCESS
           ===================================== */

        async function (data) {

            console.log(
                "========== OTP SENT =========="
            );

            console.log(data);


            try {

                /* =================================
                   SAVE MOBILE IN FLASK SESSION
                   ================================= */

                const response = await fetch(
                    "/set_mobile",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            mobile: mobile
                        })
                    }
                );


                const result =
                    await response.json();


                console.log(
                    "Flask response:",
                    result
                );


                /* =================================
                   CHECK FLASK RESPONSE
                   ================================= */

                if (!result.success) {

                    showMessage(
                        result.message ||
                        "Unable to continue."
                    );

                    sendOtpBtn.disabled = false;

                    return;
                }


                /* =================================
                   SAVE MOBILE
                   ================================= */

                sessionStorage.setItem(
                    "login_mobile",
                    mobile
                );


                /* =================================
                   OTP SENT SUCCESSFULLY
                   ================================= */

                showMessage(
                    "OTP sent successfully."
                );


                console.log(
                    "OTP sent successfully."
                );

                console.log(
                    "Opening OTP verification page..."
                );


                /* =================================
                   OPEN OTP PAGE
                   ================================= */

                window.location.href =
                    "/verify_otp";

            }


            catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    "Something went wrong. Please try again."
                );

                sendOtpBtn.disabled = false;

            }

        },


        /* =====================================
           FAILURE
           ===================================== */

        function (error) {

            console.error(
                "========== MSG91 OTP FAILED =========="
            );

            console.error(
                "Error:",
                error
            );


            showMessage(
                "MSG91 could not send OTP. Please try again."
            );


            sendOtpBtn.disabled = false;

        }

    );

});

</script>


</body>

</html>
